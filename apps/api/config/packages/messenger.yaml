framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            # Search indexing has its own queue, so a backlog there never delays outgoing mail.
            search:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_search'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            # Classification has its own queue too: a user's first sync classifies a lot of mail at once.
            classify:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_classify'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
            # Notifications have their own queue, so a reminder never waits behind other work.
            push:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_push'
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 3
            # Attachment scans wait for clamd, which can be slow or restarting (signature reloads), so they get their own
            # queue and a patient retry: about ten minutes in all before an attachment is marked failed.
            scan:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_scan'
                retry_strategy:
                    max_retries: 5
                    delay: 5000
                    multiplier: 3
            # Rescans (app:attachments:rescan) wait behind first scans; a worker consumes it after `scan`.
            scan_rescan:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_scan_rescan'
                retry_strategy:
                    max_retries: 5
                    delay: 5000
                    multiplier: 3
            # Bulk actions too, with their own consumer: archiving a whole smart inbox must not hold up sending.
            bulk:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_bulk'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            failed: '%env(MESSENGER_TRANSPORT_DSN)%_failed'
            sync: 'sync://'

        routing:
            App\Outbox\ReleaseOutgoingMessage: async
            App\Batch\ReleaseBatch: async
            App\HandOver\HandOverDue: async
            App\Search\IndexUserMail: search
            App\Scan\ScanAttachment: scan
            App\Scan\PlaceContent: scan
            App\Outbox\CollectUpload: async
            App\Classification\ClassifyNewMail: classify
            App\Classification\ReclassifyMail: classify
            App\Calendar\Invitation\ApplyCalendarInvitation: async
            App\Notification\PlanCalendarObject: push
            App\Notification\PlanUserNotifications: push
            App\Notification\FireNotification: push
            App\Notification\SendMailNotification: push
            App\Bulk\RunBulkAction: bulk

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                search: 'in-memory://'
                classify: 'in-memory://'
                push: 'in-memory://'
                scan: 'in-memory://'
                scan_rescan: 'in-memory://'
                bulk: 'in-memory://'
                failed: 'in-memory://'
