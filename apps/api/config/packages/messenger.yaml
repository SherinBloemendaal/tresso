framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            failed: '%env(MESSENGER_TRANSPORT_DSN)%_failed'
            sync: 'sync://'

        routing:
            App\Outbox\ReleaseOutgoingMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
