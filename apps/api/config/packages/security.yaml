security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        health:
            pattern: ^/health$
            security: false
        oauth_token:
            pattern: ^/oauth/token$
            security: false
        # Attachment content behind signed, expiring URLs (rendered mail cannot send access tokens).
        content:
            pattern: ^/content/
            security: false
        # Bearer tokens issued by our own OAuth2 server: clients, sync workers, third parties.
        api:
            pattern: ^/(api|internal)/
            stateless: true
            oauth2: true
        # Browser session used only to sign in and approve OAuth2 authorization requests.
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/authorize, roles: ROLE_USER }
        - { path: ^/internal/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
