# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Autoconfig lookups go to domains users type in, so private and internal addresses are refused.
    mail_autoconfig.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    # Web Push endpoints come from clients, so private and internal addresses are refused.
    notification.push_http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

when@test:
    services:
        App\Tests\Support\RecordingMercureHub:
            public: true
        App\Tests\Support\MockHttpRouter:
            public: true
            autowire: true
        App\Tests\Support\InMemoryObjectStorage:
            public: true
        App\Storage\ObjectStorage: '@App\Tests\Support\InMemoryObjectStorage'
        # Scans run against a stand-in; ClamdScannerTest talks to a real clamd.
        App\Tests\Support\FakeVirusScanner:
            public: true
        App\Scan\VirusScanner: '@App\Tests\Support\FakeVirusScanner'
        # Test hosts do not resolve; the mocked client answers instead.
        mail_autoconfig.http_client: '@http_client'
        notification.push_http_client: '@http_client'
        App\Tests\Support\StaticMxResolver:
            public: true
        App\Tests\Support\QueryLog:
            public: true
            tags: ['doctrine.middleware']
        App\Mail\Autoconfig\MxResolver: '@App\Tests\Support\StaticMxResolver'
        # Search tests run against a real Meilisearch, outside the mocked HTTP client.
        search.test_http_client:
            class: Symfony\Contracts\HttpClient\HttpClientInterface
            factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        App\Search\Meilisearch\MeilisearchClient:
            autowire: true
            arguments:
                $httpClient: '@search.test_http_client'
        App\Search\MessageIndex:
            public: true
            autowire: true
