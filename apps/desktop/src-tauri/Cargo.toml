[package]
name = "tresso-desktop"
version = "0.1.0"
description = "Desktop client"
license = "AGPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tresso_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-opener = "2.7.2"
keyring = "4.2.0"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly: rust-ini 0.21.2 added fields to `ParseOption`, which tauri-plugin-deep-link 2.6.2 builds without
# them on Linux, so it no longer compiles there. Drop this pin once the plugin sets the new fields.
rust-ini = "=0.21.1"
