name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (PHPUnit, PHPStan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      # The search tests index into a real Meilisearch.
      meilisearch:
        image: getmeili/meilisearch:v1.55
        env:
          MEILI_MASTER_KEY: ci-master-key
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?serverVersion=18&charset=utf8
      REDIS_URL: redis://localhost:6379
      MESSENGER_TRANSPORT_DSN: redis://localhost:6379/messages
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_KEY: ci-master-key
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '3310'
    steps:
      - uses: actions/checkout@v5
      # ClamdScannerTest scans with a real clamd, configured as the dev stack runs it (docker/clamav/clamd.conf), which
      # a service container could not mount before the checkout. The image ships signatures and updates them on start;
      # a step below waits until clamd reports a database.
      - name: Start clamd
        working-directory: .
        run: docker run -d --name clamav -p 3310:3310 -v "$PWD/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" clamav/clamav:1.5-debian13-slim
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, intl, sodium, zip, apcu
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Generate OAuth2 signing keys
        # Same as docker/api/entrypoint.sh: the passphrase comes from the .env files.
        run: |
          OAUTH_PASSPHRASE="$(php -r 'require "vendor/autoload.php"; (new Symfony\Component\Dotenv\Dotenv())->bootEnv(".env"); echo $_SERVER["OAUTH_PASSPHRASE"];')"
          export OAUTH_PASSPHRASE
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -aes-256-cbc -pass env:OAUTH_PASSPHRASE -out config/jwt/private.pem
          openssl pkey -in config/jwt/private.pem -passin env:OAUTH_PASSPHRASE -pubout -out config/jwt/public.pem
      - name: Prepare test database
        env:
          APP_ENV: test
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
      - name: Wait for Meilisearch
        run: timeout 60 bash -c 'until curl -fs http://localhost:7700/health; do sleep 1; done'
      - name: Wait for clamd
        # Ready means VERSION names a signature database ("ClamAV 1.5.4/28158/..."), not only that clamd answers.
        run: |
          timeout 600 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/3310 && printf "zVERSION\0" >&3 && timeout 5 head -c 200 <&3 | tr -d "\0" | grep -Eq "^ClamAV [^/]+/[0-9]+/") 2>/dev/null; do sleep 5; done'
          (exec 3<>/dev/tcp/127.0.0.1/3310 && printf "zVERSION\0" >&3 && timeout 5 head -c 200 <&3 | tr -d "\0"; echo)
      - name: PHPUnit
        run: php bin/phpunit
      - name: PHPStan
        run: |
          php bin/console cache:warmup --env=test
          php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

  sync:
    name: Sync worker (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync
    services:
      # Real IMAP server for the integration tests; same mailboxes as the dev stack.
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
            -Dgreenmail.users=kim@tresso.test:dev-password-kim,lisa@tresso.test:dev-password-lisa
        ports: ['3143:3143', '3025:3025']
      # The storage tests write to a real S3 server: the one the dev stack runs.
      rustfs:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: apps/sync/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags integration ./...
      - name: Wait for GreenMail
        run: timeout 60 bash -c 'until (echo > /dev/tcp/localhost/3143) 2>/dev/null; do sleep 1; done'
      - name: Wait for RustFS
        run: timeout 60 bash -c 'until (echo > /dev/tcp/localhost/9000) 2>/dev/null; do sleep 1; done'
      - run: go test -race -tags integration ./...
        env:
          GREENMAIL_HOST: localhost
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_ACCESS_KEY: ci-access-key
          S3_TEST_SECRET_KEY: ci-secret-key

  typescript:
    name: TypeScript (core, web, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Core
        run: |
          npm test --workspace @tresso/core
          npm run type-check --workspace @tresso/core
      - name: Web
        working-directory: apps/web
        run: |
          npx vitest run
          npx vue-tsc --build
          npx oxlint .
          npx eslint .
      - name: Mobile
        working-directory: apps/mobile
        run: |
          npm run build:editor
          git diff --exit-code -- src/compose/editorBundle.generated.ts || { echo "The editor bundle is out of date: run npm run build:editor in apps/mobile."; exit 1; }
          npx vitest run
          npx tsc --noEmit
          npx eslint --max-warnings 0 .

  desktop:
    name: Desktop (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for Tauri
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked --lib
