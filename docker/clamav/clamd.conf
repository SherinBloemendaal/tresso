# clamd for Tresso. The image's defaults, plus:
# - StreamMaxLength matches the API's CLAMAV_MAX_SIZE (25 MiB). Keep the two equal: the API does not send larger
#   files, and clamd refuses longer streams.
# - Encrypted files and files past clamd's scan limits raise a heuristic alert instead of passing as clean. The API
#   records those as "could not be scanned", not as malware.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 25M
AlertEncrypted yes
AlertExceedsMax yes
